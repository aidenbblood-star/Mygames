<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Game Hub</title>
    <style>
        /* THEME: Pure Black & Neon */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .main-content {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
        }

        /* NEW: ULTIMATE GAME HUB HEADER (Muted Gray like screenshot) */
        h1 {
            color: #444; 
            text-align: center;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* NEON SEARCH BAR */
        .search-container { text-align: center; margin-bottom: 50px; }
        .game-search { 
            width: 100%;
            padding: 15px; 
            background: #000; 
            border: 1px solid #333; 
            border-radius: 10px; 
            color: #fff;
            text-align: center;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .game-search:focus { 
            outline: none; 
            border-color: #00f2ff; 
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.6); 
        }

        /* SECTION HEADERS (The '1' in your image) */
        .letter-header {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }

        /* DARK BUTTONS (Matches 12MINIBATTLES style) */
        .buttons-container { display: flex; flex-direction: column; gap: 8px; }
        .game-btn {
            background: linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
            border: 1px solid #1a1a1a;
            color: #fff;
            padding: 16px;
            border-radius: 8px;
            width: 100%;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s ease-in-out;
            text-align: center;
            outline: none;
        }

        /* THE CYAN GLOW (Selected/Hover state) */
        .game-btn:hover, .game-btn:focus { 
            border-color: #00f2ff;
            color: #00f2ff;
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2), 0 0 15px rgba(0, 242, 255, 0.4);
            transform: scale(1.005);
        }

        /* TOP PICKS (Yellow/Green neon) */
        .fav-btn {
            background: #000;
            border: 1px solid #ccff00;
            color: #ccff00;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }
        .fav-btn:hover { box-shadow: 0 0 20px rgba(204, 255, 0, 0.3); }
    </style>
</head>
<body>

    <div class="main-content">
        <h1>ULTIMATE GAME HUB</h1> <!-- Added this header -->

        <div class="search-container">
            <input type="text" id="game-search" class="game-search" placeholder="Search through all games...">
        </div>

        <div id="favorites-container"></div>
        <div id="sections-container"></div>
    </div>

    <!-- Loading the external game list -->
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>

    <script>
        const favList = ["DRIVEMAD", "RETROBOWL", "SLOPE"];

        function buildUI() {
            if (typeof games === 'undefined') {
                setTimeout(buildUI, 100);
                return;
            }

            const container = document.getElementById('sections-container');
            const favContainer = document.getElementById('favorites-container');
            
            const sortedGames = games.sort((a, b) => a.name.localeCompare(b.name));
            
            // Build Top Picks
            favList.forEach(name => {
                const game = sortedGames.find(g => g.name.toUpperCase().includes(name));
                if (game) {
                    const btn = document.createElement('button');
                    btn.className = 'fav-btn';
                    btn.innerText = `★ ${game.name}`;
                    btn.onclick = () => window.location.href = game.url;
                    favContainer.appendChild(btn);
                }
            });

            // Build Alphabetical Sections
            const groups = {};
            sortedGames.forEach(game => {
                const firstChar = game.name.charAt(0).toUpperCase();
                const letter = isNaN(firstChar) ? firstChar : "1"; 
                if (!groups[letter]) groups[letter] = [];
                groups[letter].push(game);
            });

            Object.keys(groups).sort().forEach(letter => {
                const section = document.createElement('div');
                section.id = `section-${letter}`;
                section.innerHTML = `<div class="letter-header">${letter}</div><div class="buttons-container" id="btns-${letter}"></div>`;
                container.appendChild(section);

                groups[letter].forEach(game => {
                    const btn = document.createElement('button');
                    btn.className = 'game-btn';
                    btn.innerText = game.name;
                    btn.onclick = () => window.location.href = game.url;
                    document.getElementById(`btns-${letter}`).appendChild(btn);
                });
            });
        }

        // Search logic
        document.getElementById('game-search').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('.game-btn, .fav-btn').forEach(btn => {
                btn.style.display = btn.innerText.toLowerCase().includes(val) ? "block" : "none";
            });
            document.querySelectorAll('[id^="section-"]').forEach(sec => {
                const hasVisible = Array.from(sec.querySelectorAll('.game-btn')).some(b => b.style.display !== "none");
                sec.style.display = hasVisible ? "block" : "none";
            });
        });

        window.onload = buildUI;
    </script>
</body>
</html>
