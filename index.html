<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Game Hub</title>
    <style>
        /* THEME: Pure Black & Neon Cyan Glow */
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; overflow-x: hidden; }
        .main-content { width: 100%; max-width: 900px; padding: 40px 20px; }
        h1 { color: #444; text-align: center; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .search-container { text-align: center; margin-bottom: 50px; }
        .game-search { width: 100%; padding: 15px; background: #000; border: 1px solid #333; border-radius: 10px; color: #fff; text-align: center; font-size: 1.1rem; }
        .game-search:focus { outline: none; border-color: #00f2ff; box-shadow: 0 0 15px rgba(0, 242, 255, 0.6); }
        .letter-header { color: #fff; font-size: 14px; font-weight: bold; text-align: center; margin: 20px 0; }
        .buttons-container { display: flex; flex-direction: column; gap: 8px; }
        .game-btn { background: linear-gradient(180deg, #0a0a0a 0%, #050505 100%); border: 1px solid #1a1a1a; color: #fff; padding: 16px; border-radius: 8px; width: 100%; font-size: 13px; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: 0.2s ease-in-out; text-align: center; margin-bottom: 5px; }
        .game-btn:hover, .game-btn:focus { border-color: #00f2ff; color: #00f2ff; box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2), 0 0 15px rgba(0, 242, 255, 0.4); transform: scale(1.005); }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>ULTIMATE GAME HUB</h1>
        <div class="search-container">
            <input type="text" id="game-search" class="game-search" placeholder="Search through all games...">
        </div>

        <div id="favorites-container"></div>
        <div id="sections-container"></div>
    </div>

    <!-- EXTERNAL SOURCE: Loading the game list -->
    <script src="https://cdn.jsdelivr.net/gh/aidenbblood-star/ugs-singlefile@28a4b25e3429aa448c63047f5e2f9c9804ad67c2/games.js"></script>

   <script>
    // 1. Wait for everything to load
    window.addEventListener('load', function() {
        const searchInput = document.getElementById('game-search');
        
        // 2. Optimized search for dynamic buttons
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const allButtons = document.querySelectorAll('.game-btn');
            
            allButtons.forEach(btn => {
                // We use .value because games.js creates <input type="button">
                const gameName = btn.value.toLowerCase();
                
                if (gameName.includes(term)) {
                    btn.style.display = "block";
                    // Ensure the parent letter section is also visible
                    btn.parentElement.parentElement.style.display = "block";
                } else {
                    btn.style.display = "none";
                }
            });

            // 3. Hide letter headers if all games under them are hidden
            document.querySelectorAll('[id^="section-"]').forEach(section => {
                const visibleButtons = section.querySelectorAll('.game-btn[style*="display: block"]');
                const isSearching = term.length > 0;
                
                if (isSearching && visibleButtons.length === 0) {
                    section.style.display = "none";
                } else {
                    section.style.display = "block";
                }
            });
        });
    });
</script>

</body>
</html>
