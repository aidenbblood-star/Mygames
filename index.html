<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Ultimate Game Stash</title>
    <style>
        /* Your Cool Black & Neon Theme */
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #ffffff; margin: 0; display: flex; justify-content: center; } 
        .main-content { flex: 1; padding: 30px; max-width: 1200px; } 
        h1 { text-align: center; font-size: 3rem; text-transform: uppercase; letter-spacing: -1px; margin-bottom: 30px; } 
        h2 { text-align: center; text-transform: uppercase; letter-spacing: 3px; margin-top: 40px; margin-bottom: 20px; }
        
        .search-container { text-align: center; margin-bottom: 40px; } 
        .game-search { width: 80%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; } 
        .game-search:focus { outline: none; border-color: #00f2ff; box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); } 
        
        /* Game Buttons */
        .game-btn { background: #0f0f0f; border: 1px solid #222; padding: 18px; border-radius: 12px; cursor: pointer; color: #eee; width: 100%; margin-bottom: 12px; transition: 0.3s; font-weight: bold; text-align: center; } 
        .game-btn:hover { color: #00f2ff; border-color: #00f2ff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.6); }
        
        /* Fullscreen Game Overlay */
        #game-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; }
        #game-frame { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 10px; right: 20px; padding: 10px 20px; background: #ff3e3e; color: white; cursor: pointer; border-radius: 5px; z-index: 101; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-overlay">
        <div class="close-btn" onclick="closeGame()">CLOSE GAME</div>
        <iframe id="game-frame"></iframe>
    </div>

    <div class="main-content">
        <h1>Ultimate Game Stash</h1>
        <div class="search-container">
            <input type="text" id="game-search" class="game-search" placeholder="Search through 130+ games...">
        </div>

        <h2 style="color: #ffd700;">★ Top Picks ★</h2>
        <div id="favorites-container" style="border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 20px;"></div>

        <h2 style="color: #444;">All Games</h2>
        <div id="sections-container"></div>
    </div>
    
<script>
const USER = "aidenbblood-star";
const REPO = "Mygames";
const GAME_FOLDERS = ["games", "UGS-Files"];

// The games that stay at the top
let favorites = ["1v1lol", "retrobowl", "slope", "drivemad", "bitlife"];

async function loadGames() {
    const container = document.getElementById('sections-container');
    const favContainer = document.getElementById('favorites-container');
    
    for (const folder of GAME_FOLDERS) {
        try {
            // FIXED: Added /repos/ to the GitHub API URL
            const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${folder}`);
            if (!response.ok) continue;
            const items = await response.json();

            items.forEach(item => {
                if (item.type === "dir") { 
                    const name = item.name;
                    const btn = document.createElement('button');
                    btn.className = 'game-btn';
                    
                    if (favorites.includes(name)) {
                        btn.style.borderColor = "#ffd700";
                        btn.innerText = "★ " + name.replace(/-/g, ' ').toUpperCase();
                        favContainer.appendChild(btn);
                    } else {
                        btn.innerText = name.replace(/-/g, ' ').toUpperCase();
                        container.appendChild(btn);
                    }

                    btn.onclick = () => launchGame(name, folder);
                }
            });
        } catch (err) {
            console.error(`Error loading ${folder}:`, err);
        }
    }
}

async function launchGame(name, sourceFolder) {
    // FIXED: Added /gh/ to the jsDelivr URLs
    const url = `https://fastly.jsdelivr.net/gh/${USER}/${REPO}@main/${sourceFolder}/${name}/index.html`;
    const baseHref = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${sourceFolder}/${name}/`;
    
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("File not found");
        let html = await response.text();
        
        const baseTag = `<base href="${baseHref}">`;
        
        if (html.includes('<head>')) {
            html = html.replace('<head>', `<head>${baseTag}`);
        } else {
            html = baseTag + html;
        }

        const blob = new Blob([html], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        document.getElementById('game-frame').src = blobUrl;
        document.getElementById('game-overlay').style.display = 'block';
    } catch (err) {
        console.error("Game load failed:", err);
        alert("Game failed to load. Check if the folder name is correct in GitHub.");
    }
}

function closeGame() {
    document.getElementById('game-overlay').style.display = 'none';
    document.getElementById('game-frame').src = "";
}

document.getElementById('game-search').addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase();
    document.querySelectorAll('.game-btn').forEach(btn => {
        btn.style.display = btn.innerText.toLowerCase().includes(val) ? "block" : "none";
    });
});

loadGames();
</script>

</body>
</html>
