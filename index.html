<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Ultimate Game Stash</title>
    <style>
        /* Your Cool Black & Neon Theme */
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #ffffff; margin: 0; display: flex; justify-content: center; } 
        .main-content { flex: 1; padding: 30px; max-width: 1200px; } 
        h1 { text-align: center; font-size: 3rem; text-transform: uppercase; letter-spacing: -1px; margin-bottom: 30px; } 
        h2 { text-align: center; text-transform: uppercase; letter-spacing: 3px; margin-top: 40px; margin-bottom: 20px; }
        .search-container { text-align: center; margin-bottom: 40px; } 
        .game-search { width: 80%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; } 
        .game-search:focus { outline: none; border-color: #00f2ff; box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); } 
        .game-btn { background: #0f0f0f; border: 1px solid #222; padding: 18px; border-radius: 12px; cursor: pointer; color: #eee; width: 100%; margin-bottom: 12px; transition: 0.3s; font-weight: bold; text-align: center; } 
        .game-btn:hover { color: #00f2ff; border-color: #00f2ff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.6); }
        #game-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; }
        #game-frame { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 10px; right: 20px; padding: 10px 20px; background: #ff3e3e; color: white; cursor: pointer; border-radius: 5px; z-index: 101; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-overlay">
        <div class="close-btn" onclick="closeGame()">CLOSE GAME</div>
        <iframe id="game-frame"></iframe>
    </div>

    <div class="main-content">
        <h1>Ultimate Game Stash</h1>
        <div class="search-container">
            <input type="text" id="game-search" class="game-search" placeholder="Search through all games...">
        </div>
        <h2 style="color: #ffd700;">★ Top Picks ★</h2>
        <div id="favorites-container" style="border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 20px;"></div>
        <h2 style="color: #444;">All Games</h2>
        <div id="sections-container"></div>
    </div>
<script>    
const USER = "aidenbblood-star";
const REPO = "Mygames";
const UGS_FOLDER = "ugs"; 
const GAMES_FOLDER = "games";

let favorites = ["1v1lol", "retrobowl", "slope", "drivemad", "bitlife"];

async function loadGames() {
    const container = document.getElementById('sections-container');
    const favContainer = document.getElementById('favorites-container');
    container.innerHTML = "";
    favContainer.innerHTML = "";

    // 1. Fetch data from both folders
    const gamesData = await fetchFromGitHub(GAMES_FOLDER, true);
    const ugsData = await fetchFromGitHub(UGS_FOLDER, false);

    // 2. Combine and Sort A-Z
    const allGames = [...gamesData, ...ugsData].sort((a, b) => 
        a.name.localeCompare(b.name)
    );

    // 3. Create the buttons
    allGames.forEach(game => {
        const btn = document.createElement('button');
        btn.className = 'game-btn';
        const displayName = game.name.replace(/-/g, ' ').toUpperCase();

        // Add to Favorites if it matches your list
        if (favorites.includes(game.name.toLowerCase())) {
            const favBtn = btn.cloneNode(true);
            favBtn.style.borderColor = "#ffd700";
            favBtn.innerText = "★ " + displayName;
            favBtn.onclick = () => launchDirect(game.url, game.folder, game.name);
            favContainer.appendChild(favBtn);
        }

        btn.innerText = displayName;
        btn.onclick = () => launchDirect(game.url, game.folder, game.name);
        container.appendChild(btn);
    });
}

async function fetchFromGitHub(folderPath, isFolderMode) {
    let collected = [];
    try {
        const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${encodeURIComponent(folderPath)}`);
        if (!response.ok) return [];
        const items = await response.json();

        items.forEach(item => {
            if (isFolderMode && item.type === "dir") {
                collected.push({
                    name: item.name,
                    folder: folderPath,
                    url: `https://fastly.jsdelivr.net/gh/${USER}/${REPO}@main/${folderPath}/${item.name}/index.html`
                });
            } else if (!isFolderMode && item.name.endsWith(".html")) {
                collected.push({
                    name: item.name.replace(".html", "").replace(/^cl/i, ""),
                    folder: folderPath,
                    url: `https://fastly.jsdelivr.net/gh/${USER}/${REPO}@main/${folderPath}/${item.name}`
                });
            }
        });
    } catch (err) { console.error("Fetch failed", err); }
    return collected;
}

function launchDirect(url, folder, name) {
    const frame = document.getElementById('game-frame');
    const baseHref = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${folder}/${name}/`;
    
    fetch(url).then(res => res.text()).then(html => {
        const baseTag = `<base href="${baseHref}">`;
        const fullHtml = html.includes('<head>') ? html.replace('<head>', `<head>${baseTag}`) : baseTag + html;
        const blob = new Blob([fullHtml], { type: 'text/html' });
        frame.src = URL.createObjectURL(blob);
        document.getElementById('game-overlay').style.display = 'block';
    }).catch(err => alert("Game failed to load."));
}

function closeGame() {
    document.getElementById('game-overlay').style.display = 'none';
    document.getElementById('game-frame').src = "";
}

document.getElementById('game-search').addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase();
    document.querySelectorAll('#sections-container .game-btn').forEach(btn => {
        btn.style.display = btn.innerText.toLowerCase().includes(val) ? "block" : "none";
    });
});

loadGames();
</script>



</body>
</html>
