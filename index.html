<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Ultimate Game Stash</title>
    <style>
        /* Your Original Cool Black & Neon Theme - CENTERED, NO SIDEBAR */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #050505; 
            color: #ffffff; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
        } 

        .main-content { 
            flex: 1; 
            padding: 30px; 
            max-width: 1000px; 
            width: 100%;
        } 

        h1 { text-align: center; font-size: 3rem; text-transform: uppercase; letter-spacing: -1px; margin-bottom: 30px; } 
        h2 { text-align: center; text-transform: uppercase; letter-spacing: 3px; margin-top: 40px; margin-bottom: 20px; }
        
        /* THE SEARCH BAR */
        .search-container { text-align: center; margin-bottom: 40px; } 
        .game-search { 
            width: 90%; 
            padding: 15px; 
            background: #1a1a1a; 
            border: 1px solid #333; 
            border-radius: 10px; 
            color: #fff; 
            font-size: 1rem;
        } 
        .game-search:focus { outline: none; border-color: #00f2ff; box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); } 
        
        /* THE GAME BUTTONS */
        .game-btn { 
            background: #0f0f0f; 
            border: 1px solid #222; 
            padding: 18px; 
            border-radius: 12px; 
            cursor: pointer; 
            color: #eee; 
            width: 100%; 
            margin-bottom: 12px; 
            transition: 0.3s; 
            font-weight: bold; 
            text-align: center; 
            display: block; 
        } 
        .game-btn:hover { color: #00f2ff; border-color: #00f2ff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.6); }
        
        .letter-header { 
            font-size: 2rem; 
            color: #00f2ff; 
            border-bottom: 1px solid #222; 
            margin: 40px 0 20px 0; 
            padding-bottom: 5px; 
            text-align: center;
        }

        /* GAME OVERLAY */
        #game-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; }
        #game-frame { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 10px; right: 20px; padding: 10px 20px; background: #ff3e3e; color: white; cursor: pointer; border-radius: 5px; z-index: 2001; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-overlay">
        <div class="close-btn" onclick="closeGame()">CLOSE GAME</div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <div class="main-content">
        <h1>Ultimate Game Stash</h1>
        
        <!-- SEARCH BAR AREA -->
        <div class="search-container">
            <input type="text" id="game-search" class="game-search" placeholder="Search through all games...">
        </div>
        
        <h2 style="color: #ffd700;">★ Top Picks ★</h2>
        <div id="favorites-container" style="border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 20px;"></div>
        
        <div id="sections-container"></div>
    </div>

<script>    
const USER = "aidenbblood-star";
const REPO = "Mygames";
const favorites = ["1v1lol", "retrobowl", "slope", "drivemad", "bitlife", "10minutestildawn"];

async function loadGames() {
    const container = document.getElementById('sections-container');
    const favContainer = document.getElementById('favorites-container');

    const gamesData = await fetchFromGitHub("games", true);
    const ugsData = await fetchFromGitHub("ugs", false);

    let allGames = [...gamesData, ...ugsData].filter((game, index, self) =>
        index === self.findIndex((g) => g.name.toLowerCase() === game.name.toLowerCase())
    ).sort((a, b) => a.name.localeCompare(b.name));

    const groups = {};
    allGames.forEach(game => {
        let char = game.name.trim().charAt(0).toUpperCase();
        if (!groups[char]) groups[char] = [];
        groups[char].push(game);
    });

    Object.keys(groups).sort().forEach(letter => {
        const section = document.createElement('div');
        section.className = 'letter-section';
        section.innerHTML = `<div class="letter-header">${letter}</div>`;
        
        groups[letter].forEach(game => {
            const displayName = game.name.replace(/-/g, ' ').toUpperCase();
            const btn = document.createElement('button');
            btn.className = 'game-btn';
            btn.innerText = displayName;
            btn.onclick = () => launchDirect(game.url);

            if (favorites.includes(game.name.toLowerCase())) {
                const favBtn = btn.cloneNode(true);
                favBtn.style.borderColor = "#ffd700";
                favBtn.innerText = "★ " + displayName;
                favBtn.onclick = () => launchDirect(game.url);
                favContainer.appendChild(favBtn);
            }
            section.appendChild(btn);
        });
        container.appendChild(section);
    });
}

async function fetchFromGitHub(folder, isFolderMode) {
    try {
        const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${folder}`);
        const items = await res.json();
        return items.map(item => {
            let cleanName = item.name.replace(".html", "").replace(/^cl/i, "").replace(/-/g, ' ');
            let url = isFolderMode 
                ? `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${folder}/${item.name}/index.html`
                : `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${folder}/${item.name}`;
            return { name: cleanName, url };
        }).filter(item => item.name.toLowerCase() !== "index");
    } catch { return []; }
}

// THE SIMPLE LAUNCHER: Best for complex Unity scripts
function launchDirect(url) {
    const frame = document.getElementById('game-frame');
    frame.src = url; 
    document.getElementById('game-overlay').style.display = 'block';
}

function closeGame() {
    document.getElementById('game-overlay').style.display = 'none';
    document.getElementById('game-frame').src = "";
}

// THE SEARCH LOGIC
document.getElementById('game-search').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    document.querySelectorAll('.game-btn').forEach(btn => {
        btn.style.display = btn.innerText.toLowerCase().includes(term) ? "block" : "none";
    });
    // Hide empty letter headers
    document.querySelectorAll('.letter-section').forEach(section => {
        const hasVisible = Array.from(section.querySelectorAll('.game-btn')).some(b => b.style.display !== 'none');
        section.style.display = hasVisible ? 'block' : 'none';
    });
});

loadGames();
</script>
</body>
</html>
