<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Game Hub</title>
    <style>
    body { 
        background-color: #000; 
        color: #fff; 
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        padding: 20px; 
        margin: 0;
        overflow-x: hidden;
    }

    h1 { 
        letter-spacing: 4px; 
        color: #444; 
        font-size: 1.2rem;
        margin: 40px 0 20px 0;
        text-transform: uppercase;
    }

    /* SEARCH BAR: Wide and dark like the image */
    .game-search { 
        width: 95%; 
        max-width: 800px; 
        padding: 15px; 
        background: #0a0a0a; 
        border: 1px solid #1a1a1a; 
        border-radius: 8px; 
        color: #fff; 
        margin-bottom: 30px; 
        text-align: center;
        outline: none;
        font-size: 1rem;
        transition: border-color 0.3s;
    }

    .game-search:focus { border-color: #00f2ff; }

    /* SECTIONS: Stacks letters and buttons vertically */
    #sections-container { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        width: 100%; 
        max-width: 800px; 
    }

    .letter-header { 
        color: #444; 
        font-size: 0.9rem; 
        margin: 25px 0 10px 0; 
        text-transform: uppercase;
        width: 100%;
        text-align: center;
        letter-spacing: 2px;
    }

    /* GAME BUTTONS: The "Long Bar" look from your image */
    .game-btn { 
        background: #0d0d0d; 
        border: 1px solid #1a1a1a; 
        color: #fff; 
        padding: 18px; 
        margin: 4px 0; 
        border-radius: 8px; 
        width: 100%; 
        cursor: pointer; 
        transition: all 0.3s ease; 
        font-weight: bold;
        text-align: center;
        text-transform: uppercase;
        font-size: 0.85rem;
        display: block; /* Ensures it stays a full-width bar */
    }

    /* HOVER EFFECT: Keeps your glowing blue style */
    .game-btn:hover { 
        background: #050505; 
        border-color: #00f2ff; 
        color: #00f2ff; 
        box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); 
        transform: scale(1.005);
    }

    /* Helper for Search Logic to keep bars full width */
    div[id^="section-"] { 
        width: 100%; 
        display: flex;
        flex-direction: column;
        align-items: center;
    }
</style>

</head>
<body>
    <h1>ULTIMATE GAME HUB</h1>
    <input type="text" id="game-search" class="game-search" placeholder="Search 1,000+ games...">
    <div id="sections-container"></div>
<script>
    window.GAME_HASH = "d4ec2e0f09330579581c4bbc363f990cab6ff30b"; 
    const myUser = "aidenbblood-star";
    const myRepo = "ugs-singlefile";

    // Forces the specific hash to avoid the 871MB "Size Exceeded" error
    window.open = (function(n) {
        return function(url, name, specs) {
            if (url && url.includes('jsdelivr.net')) {
                url = url.replace(/@main|@latest/, '@' + window.GAME_HASH);
            }
            return n(url, name, specs);
        };
    })(window.open);

    // LOAD GAMES.JS
    const script = document.createElement('script');
    script.src = `https://fastly.jsdelivr.net/gh/${myUser}/${myRepo}@${window.GAME_HASH}/src/games.js?t=978`;
    
    script.onload = () => { 
        console.log("File found! Checking for buildStash...");
        if (typeof buildStash === 'function') {
            buildStash(); 
        } else {
            console.error("buildStash() is missing in games.js!");
        }
    };
    
    script.onerror = () => {
        console.error("404: Could not find games.js at this Hash/Path!");
    };
    
    document.head.appendChild(script);

    // SEARCH LOGIC (FIXED BRACKETS)
    document.getElementById('game-search').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.game-btn').forEach(btn => {
            btn.style.display = btn.innerText.toLowerCase().includes(val) ? "inline-block" : "none";
        });
        document.querySelectorAll('div[id^="section-"]').forEach(sec => {
            const hasVisible = Array.from(sec.querySelectorAll('.game-btn')).some(b => b.style.display !== 'none');
            sec.style.display = hasVisible ? "block" : "none";
        });
    });
</script>


      

        

</body>
</html>
