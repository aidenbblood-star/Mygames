<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Game Hub</title>
    <style>
        /* THEME: Pure Black & Neon Cyan Glow */
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; overflow-x: hidden; }
        .main-content { width: 100%; max-width: 900px; padding: 40px 20px; }
        h1 { color: #444; text-align: center; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .search-container { text-align: center; margin-bottom: 50px; }
        .game-search { width: 100%; padding: 15px; background: #000; border: 1px solid #333; border-radius: 10px; color: #fff; text-align: center; font-size: 1.1rem; }
        .game-search:focus { outline: none; border-color: #00f2ff; box-shadow: 0 0 15px rgba(0, 242, 255, 0.6); }
        .letter-header { color: #fff; font-size: 14px; font-weight: bold; text-align: center; margin: 20px 0; }
        .buttons-container { display: flex; flex-direction: column; gap: 8px; }
        .game-btn { background: linear-gradient(180deg, #0a0a0a 0%, #050505 100%); border: 1px solid #1a1a1a; color: #fff; padding: 16px; border-radius: 8px; width: 100%; font-size: 13px; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: 0.2s ease-in-out; text-align: center; }
        .game-btn:hover, .game-btn:focus { border-color: #00f2ff; color: #00f2ff; box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2), 0 0 15px rgba(0, 242, 255, 0.4); transform: scale(1.005); }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>ULTIMATE GAME HUB</h1>
        <div class="search-container">
            <input type="text" id="game-search" class="game-search" placeholder="Search through all games...">
        </div>

        <!-- DO NOT CHANGE THESE IDs - THEY FIX THE ERROR -->
        <div id="favorites-container"></div>
        <div id="sections-container"></div>
    </div>

      <!-- EXTERNAL SOURCE: Loading the game list -->
    <script src="https://cdn.jsdelivr.net/gh/aidenbblood-star/ugs-singlefile@main/games.js"></script>

    <script>
        // Use DOMContentLoaded to ensure elements exist before the script runs
        document.addEventListener('DOMContentLoaded', function() {
            function buildUI() {
                if (typeof games === 'undefined') {
                    setTimeout(buildUI, 100);
                    return;
                }

                const container = document.getElementById('sections-container');
                const favContainer = document.getElementById('favorites-container');
                
                // Safety check to prevent the 'null' error
                if (!container || !favContainer) return;

                const sortedGames = games.sort((a, b) => a.name.localeCompare(b.name));
                const groups = {};
                sortedGames.forEach(game => {
                    const firstChar = game.name.charAt(0).toUpperCase();
                    const letter = isNaN(firstChar) ? firstChar : "1"; 
                    if (!groups[letter]) groups[letter] = [];
                    groups[letter].push(game);
                });

                Object.keys(groups).sort().forEach(letter => {
                    const section = document.createElement('div');
                    section.id = `section-${letter}`;
                    section.innerHTML = `<div class="letter-header">${letter}</div><div class="buttons-container" id="btns-${letter}"></div>`;
                    container.appendChild(section);

                    groups[letter].forEach(game => {
                        const btn = document.createElement('button');
                        btn.className = 'game-btn';
                        btn.innerText = game.name;
                        btn.onclick = () => window.location.href = game.url;
                        document.getElementById(`btns-${letter}`).appendChild(btn);
                    });
                });
            }

            document.getElementById('game-search').addEventListener('input', (e) => {
                const val = e.target.value.toLowerCase();
                document.querySelectorAll('.game-btn').forEach(btn => {
                    btn.style.display = btn.innerText.toLowerCase().includes(val) ? "block" : "none";
                });
            });

            buildUI();
        });
    </script>
</body>
</html>
