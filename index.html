<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ultimate Game Stash Pro</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --sidebar-bg: rgba(255, 255, 255, 0.05);
            --button-bg: rgba(255, 255, 255, 0.1);
        }

        /* 1. COOL ANIMATED BACKGROUND */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #050505, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            margin: 0;
            display: flex;
            color: #fff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. GLASSMORPHISM SIDEBAR */
        .sidebar {
            position: fixed;
            left: 0; top: 0; width: 80px; height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 10px;
            padding: 20px 10px; overflow-y: auto; z-index: 1000;
        }

        .sidebar-btn {
            background: var(--button-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px; border-radius: 10px; color: #fff;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .sidebar-btn:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            transform: scale(1.1);
        }

        /* 3. MAIN CONTENT & SEARCH */
        .main-content { margin-left: 110px; flex: 1; padding: 40px; }
        
        .search-container { text-align: center; margin-bottom: 50px; }
        
        .game-search {
            width: 70%; padding: 15px 25px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px; color: #fff; font-size: 1.1rem;
            backdrop-filter: blur(5px); transition: 0.3s;
        }

        .game-search:focus {
            outline: none; border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        /* 4. GAME BUTTONS (NEON STYLE) */
        .letter-section { margin-bottom: 50px; }
        .letter-header { font-size: 2.5rem; margin-bottom: 20px; border-bottom: 2px solid var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        .game-btn {
            background: var(--button-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 15px; color: #eee;
            width: 100%; text-align: left; font-size: 1.1rem;
            margin-bottom: 12px; cursor: pointer; transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .game-btn:hover {
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--neon-blue);
            color: #fff; transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 242, 255, 0.3);
        }

        /* GAME OVERLAY */
        #game-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; }
        #game-frame { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 20px; right: 30px; padding: 12px 25px; background: #ff3e3e; color: #fff; cursor: pointer; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <div id="game-overlay">
        <div class="close-btn" onclick="closeGame()">CLOSE GAME</div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <div class="main-content">
        <h1>ULTIMATE GAME STASH</h1>
        <div class="search-container">
            <input type="text" id="game-search" class="game-search" placeholder="Type to search games...">
        </div>
        <div id="sections-container"></div>
    </div>

<script>
const USER = "aidenbblood-star";
const REPO = "Mygames";

async function loadGames() {
    const sections = document.getElementById('sections-container');
    const sidebar = document.getElementById('sidebar');

    const gamesData = await fetchFromGitHub("games", true);
    const ugsData = await fetchFromGitHub("ugs", false);

    let allGames = [...gamesData, ...ugsData].filter((game, index, self) =>
        index === self.findIndex((g) => g.name.toLowerCase() === game.name.toLowerCase())
    ).sort((a, b) => a.name.localeCompare(b.name));

    const groups = {};
    allGames.forEach(game => {
        let char = game.name.trim().charAt(0).toUpperCase();
        if (!groups[char]) groups[char] = [];
        groups[char].push(game);
    });

    Object.keys(groups).sort().forEach(letter => {
        const sideBtn = document.createElement('button');
        sideBtn.className = 'sidebar-btn';
        sideBtn.innerText = letter;
        sideBtn.onclick = () => document.getElementById(`section-${letter}`).scrollIntoView({behavior: 'smooth'});
        sidebar.appendChild(sideBtn);

        const section = document.createElement('div');
        section.className = 'letter-section';
        section.id = `section-${letter}`;
        section.innerHTML = `<div class="letter-header">${letter}</div>`;
        
        groups[letter].forEach(game => {
            const btn = document.createElement('button');
            btn.className = 'game-btn';
            btn.innerText = game.name.toUpperCase();
            btn.onclick = () => launchGame(game.url);
            section.appendChild(btn);
        });
        sections.appendChild(section);
    });
}

async function fetchFromGitHub(folder, isFolderMode) {
    try {
        const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${folder}`);
        const items = await res.json();
        return items.map(item => {
            let cleanName = item.name.replace(".html", "").replace(/-/g, ' ');
            if (cleanName.toLowerCase().startsWith("cl")) cleanName = cleanName.substring(2);
            
            let url = isFolderMode 
                ? `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${folder}/${item.name}/index.html`
                : `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${folder}/${item.name}`;
            return { name: cleanName, url };
        }).filter(item => item.name.toLowerCase() !== "index");
    } catch { return []; }
}

function launchGame(url) {
    document.getElementById('game-frame').src = url;
    document.getElementById('game-overlay').style.display = 'block';
}

function closeGame() {
    document.getElementById('game-overlay').style.display = 'none';
    document.getElementById('game-frame').src = "";
}

// SEARCH FUNCTIONALITY
document.getElementById('game-search').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    document.querySelectorAll('.letter-section').forEach(section => {
        let hasVisibleGame = false;
        section.querySelectorAll('.game-btn').forEach(btn => {
            const match = btn.innerText.toLowerCase().includes(term);
            btn.style.display = match ? "block" : "none";
            if (match) hasVisibleGame = true;
        });
        // Hide the whole A, B, C section if no games match
        section.style.display = hasVisibleGame ? "block" : "none";
    });
});

loadGames();
</script>
</body>
</html>
