<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Game Hub</title>
    <style>
        /* CSS from your previous code here... */
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; overflow-x: hidden; }
        .main-content { width: 100%; max-width: 900px; padding: 40px 20px; }
        .game-btn { background: #0a0a0a; border: 1px solid #1a1a1a; color: #fff; padding: 16px; border-radius: 8px; width: 100%; cursor: pointer; text-align: center; margin-bottom: 5px; }
        .letter-header { color: #fff; font-size: 14px; font-weight: bold; text-align: center; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>ULTIMATE GAME HUB</h1>
        <div class="search-container">
            <input type="text" id="game-search" placeholder="Search through all games..." style="width: 100%; padding: 15px; background: #000; border: 1px solid #333; color: #fff; text-align: center;">
        </div>
        <div id="sections-container"></div>
    </div>

    <script>
        // --- THE APPENDCHILD METHOD ---
        const script = document.createElement('script');
        // Use the SPECIFIC HASH from your GitHub commit to bypass the 50MB error
        script.src = "https://cdn.jsdelivr.net/gh/aidenbblood-star/ugs-singlefile@4c4db16f27b6e7c81c63b3bb6a3dbe99addbebe7/games.js";
        script.async = true; 
        
        script.onload = function() {
            console.log("Games list loaded!");
            if (typeof buildStash === 'function') buildStash();
        };
        document.head.appendChild(script);

        // Search logic
        document.getElementById('game-search').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.game-btn').forEach(btn => {
                btn.style.display = btn.value.toLowerCase().includes(val) ? "block" : "none";
            });
            document.querySelectorAll('[id^="section-"]').forEach(section => {
                const hasVisible = Array.from(section.querySelectorAll('.game-btn')).some(b => b.style.display !== 'none');
                section.style.display = (val === "" || hasVisible) ? "block" : "none";
            });
        });
    </script>
</body>
</html>
