<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Game Hub</title>
    <style>
        /* THEME: Pure Black & Neon Cyan Glow */
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            overflow-x: hidden; 
        }
        .main-content { 
            width: 100%; 
            max-width: 900px; 
            padding: 40px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center; /* This centers the "Ultimate Game Hub" text */
        }
        h1 { 
            color: #fff; 
            text-align: center; 
            font-size: 2rem; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.8), 0 0 20px rgba(0, 242, 255, 0.4);
        }
        .search-container { width: 100%; text-align: center; margin-bottom: 50px; }
        .game-search { 
            width: 80%; 
            padding: 15px; 
            background: #000; 
            border: 1px solid #333; 
            border-radius: 10px; 
            color: #fff; 
            text-align: center; 
            font-size: 1.1rem; 
            transition: 0.3s;
        }
        .game-search:focus { 
            outline: none; 
            border-color: #00f2ff; 
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.6); 
        }
        .letter-header { 
            color: #00f2ff; 
            font-size: 1.5rem; 
            font-weight: bold; 
            text-align: center; 
            margin: 30px 0 15px 0;
            text-shadow: 0 0 8px rgba(0, 242, 255, 0.5);
        }
        .buttons-container { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 100%;
            max-width: 600px;
        }
        .game-btn { 
            background: linear-gradient(180deg, #0a0a0a 0%, #050505 100%); 
            border: 1px solid #1a1a1a; 
            color: #fff; 
            padding: 18px; 
            border-radius: 10px; 
            width: 100%; 
            font-size: 14px; 
            font-weight: 600; 
            text-transform: uppercase; 
            cursor: pointer; 
            transition: 0.3s ease-in-out; 
            text-align: center; 
        }
        .game-btn:hover { 
            border-color: #00f2ff; 
            color: #00f2ff; 
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2), 0 0 20px rgba(0, 242, 255, 0.5); 
            transform: translateY(-2px); 
        }
        #sections-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>ULTIMATE GAME HUB</h1>
        <div class="search-container">
            <input type="text" id="game-search" class="game-search" placeholder="Search through all games...">
        </div>
        <div id="sections-container"></div>
    </div>

    <script>
        // THIS IS THE FIX: Only call the file once, and use a specific version number to clear cache
        const script = document.createElement('script');
        // Added ?v=99 to the end to force jsDelivr to stop showing the "Package Size" error
       // CORRECTED: Just the URL string, no extra <script> tags inside
script.src = "https://cdn.jsdelivr.net/gh/aidenbblood-star/ugs-singlefile@89b7686959f3962854a3547928e336ea7573a49b/src/games.js?v=979";


        script.async = true; 
        
        script.onload = function() {
            if (typeof buildStash === 'function') buildStash();
        };

        document.head.appendChild(script);

        // Search logic that handles the neon sections
        document.getElementById('game-search').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.game-btn').forEach(btn => {
                btn.style.display = btn.value.toLowerCase().includes(val) ? "block" : "none";
            });
            document.querySelectorAll('[id^="section-"]').forEach(section => {
                const hasVisible = Array.from(section.querySelectorAll('.game-btn')).some(b => b.style.display !== 'none');
                section.style.display = (val === "" || hasVisible) ? "block" : "none";
            });
        });
    </script>
</body>
</html>
