<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Game Stash</title>
    <style>
        /* BASE THEME: Blue Gradient */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #2e3244 0%, #36224b 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
        }

        /* SIDEBAR NAVIGATION */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 80px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-btn {
            background: rgb(89, 134, 218);
            border: none;
            padding: 12px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            text-align: center;
        }

        .sidebar-btn:hover { background: #79aadb; transform: scale(1.1); }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 100px;
            flex: 1;
            padding: 40px;
        }

        h1 { color: white; text-align: center; font-size: 3rem; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* NEON SEARCH BAR */
        .search-container { text-align: center; margin-bottom: 40px; }
        .game-search { 
            width: 70%; 
            padding: 15px; 
            background: #1a1a1a; 
            border: 1px solid #333; 
            border-radius: 10px; 
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }
        .search-container input:focus { 
            outline: none; 
            border-color: #00f2ff; 
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); 
        }

        /* LETTER SECTIONS */
        .letter-header {
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin: 40px 0 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid rgba(255,255,255,0.3);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        /* BLUE GAME BUTTONS */
        .game-btn {
            background: rgb(89, 134, 218);
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 600px;
            color: white;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            background: #79aadb;
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <h1>Ultimate Game Stash</h1>

        <div class="search-container">
            <input type="text" id="game-search" class="game-search" placeholder="Search through all games...">
        </div>
        
        <div id="sections-container"></div>
    </div>

    <!-- The original loading script you provided -->
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>

    <script>
        // Use the list generated by games.js and apply your custom layout/search
        function buildUI() {
            if (typeof games === 'undefined') {
                setTimeout(buildUI, 100);
                return;
            }

            const container = document.getElementById('sections-container');
            const sidebar = document.getElementById('sidebar');
            container.innerHTML = "";
            sidebar.innerHTML = "";

            // 1. Group games by letter
            const groups = {};
            games.forEach(game => {
                const letter = game.name.charAt(0).toUpperCase();
                if (!groups[letter]) groups[letter] = [];
                groups[letter].push(game);
            });

            // 2. Build A-Z Sections
            Object.keys(groups).sort().forEach(letter => {
                // Add Sidebar Button
                const sideBtn = document.createElement('button');
                sideBtn.className = 'sidebar-btn';
                sideBtn.innerText = letter;
                sideBtn.onclick = () => document.getElementById(`section-${letter}`).scrollIntoView({behavior: "smooth"});
                sidebar.appendChild(sideBtn);

                // Add Alphabet Section
                const section = document.createElement('div');
                section.id = `section-${letter}`;
                section.innerHTML = `<div class="letter-header">${letter}</div><div class="buttons-container" id="btns-${letter}"></div>`;
                container.appendChild(section);

                // Add Game Buttons
                groups[letter].forEach(game => {
                    const btn = document.createElement('button');
                    btn.className = 'game-btn';
                    btn.innerText = game.name;
                    btn.onclick = () => window.location.href = game.url; // Keeps original loading logic
                    document.getElementById(`btns-${letter}`).appendChild(btn);
                });
            });
        }

        // Search Filter Logic
        document.getElementById('game-search').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('.game-btn').forEach(btn => {
                btn.style.display = btn.innerText.toLowerCase().includes(val) ? "block" : "none";
            });
            // Hide empty letter headers during search
            document.querySelectorAll('[id^="section-"]').forEach(section => {
                const hasVisible = Array.from(section.querySelectorAll('.game-btn')).some(b => b.style.display !== "none");
                section.style.display = hasVisible ? "block" : "none";
            });
        });

        window.onload = buildUI;
    </script>
</body>
</html>
