<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Ultimate Game Stash</title>
    <style>
        /* COOL BLACK & NEON THEME */
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #ffffff; margin: 0; display: flex; justify-content: center; } 
        .main-content { flex: 1; padding: 30px; max-width: 1000px; width: 100%; } 
        h1 { text-align: center; font-size: 3rem; text-transform: uppercase; letter-spacing: -1px; margin-bottom: 30px; } 
        .game-search { width: 90%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 1rem; margin-bottom: 40px; } 
        .game-btn { background: #0f0f0f; border: 1px solid #222; padding: 18px; border-radius: 12px; cursor: pointer; color: #eee; width: 100%; margin-bottom: 12px; transition: 0.3s; font-weight: bold; text-align: center; display: block; } 
        .game-btn:hover { color: #00f2ff; border-color: #00f2ff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.6); }
        #game-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; overflow: hidden; }
        #game-frame { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 10px; right: 20px; padding: 10px 20px; background: #ff3e3e; color: white; cursor: pointer; border-radius: 5px; z-index: 2001; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-overlay">
        <div class="close-btn" onclick="closeGame()">CLOSE GAME</div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <div class="main-content">
        <h1>Ultimate Game Stash</h1>
        <div style="text-align:center;">
            <input type="text" id="game-search" class="game-search" placeholder="Search games...">
        </div>
        <div id="favorites-container"></div>
        <div id="sections-container"></div>
    </div>

<script>    
const USER = "aidenbblood-star";
const REPO = "Mygames";
const BRANCH = "main"; 

// 1. HARDCODE YOUR GAMES HERE
// This replaces the "fetch" that was breaking.
// Use the folder name as the 'path' and whatever you want for 'name'.
const gamesList = [
    { name: "10 Minutes Till Dawn", path: "ugs/10minutestildawn" },
    { name: "1v1.lol", path: "ugs/1v1lol" },
    { name: "Retro Bowl", path: "ugs/retrobowl" },
    { name: "Slope", path: "ugs/slope" },
    { name: "Drive Mad", path: "ugs/drivemad" },
    { name: "Bitlife", path: "ugs/bitlife" }
];

const favorites = ["1v1lol", "retrobowl", "slope", "drivemad", "bitlife", "10minutestildawn"];

function launchGame(folderPath) {
    const overlay = document.getElementById('game-overlay');
    const frame = document.getElementById('game-frame');
    
    // Uses jsDelivr for the actual game files (files don't have the same API rate limit)
    const gameUrl = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@${BRANCH}/${folderPath}/index.html`;
    
    frame.src = gameUrl;
    overlay.style.display = 'block';
    document.body.style.overflow = 'hidden'; 
}

function closeGame() {
    document.getElementById('game-overlay').style.display = 'none';
    document.getElementById('game-frame').src = "";
    document.body.style.overflow = 'auto';
}

function loadGames() {
    const container = document.getElementById('sections-container');
    const favContainer = document.getElementById('favorites-container');
    
    container.innerHTML = ""; 
    favContainer.innerHTML = "";

    gamesList.forEach(game => {
        const btn = document.createElement('div');
        btn.className = 'game-btn';
        btn.innerText = game.name.toUpperCase();
        btn.onclick = () => launchGame(game.path);

        // Add to Favorites if it matches
        const simpleName = game.path.split('/').pop().toLowerCase();
        if (favorites.includes(simpleName)) {
            const favBtn = btn.cloneNode(true);
            favBtn.onclick = () => launchGame(game.path);
            favContainer.appendChild(favBtn);
        }

        container.appendChild(btn);
    });
}

function searchGames() {
    let input = document.getElementById('game-search').value.toLowerCase();
    let btns = document.getElementsByClassName('game-btn');
    for (let i = 0; i < btns.length; i++) {
        btns[i].style.display = btns[i].innerText.toLowerCase().includes(input) ? "block" : "none";
    }
}

// Run immediately
loadGames();
</script>

</body>
</html>
